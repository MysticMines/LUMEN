<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LUMEN 光引 · 摄影工具箱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Monoton&display=swap" rel="stylesheet">
<style>
:root{--y:#FFD60A;--y2:#FFC300;--ys:#FFF8D6;--ink:#111;--i2:#5A5A5A;--i3:#9A9A9A;--ln:#EBEBEB;--bg:#FFFDF8}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;-webkit-font-smoothing:antialiased}
.mono{font-family:'Monoton',Impact,cursive;font-weight:400;letter-spacing:3px}
header{max-width:1100px;margin:0 auto;padding:56px 24px 32px;text-align:center}
h1{font-size:clamp(38px,8vw,76px);line-height:1.05;text-shadow:4px 4px 0 rgba(255,214,10,.55)}
.sub{margin-top:14px;font-size:14px;letter-spacing:.2em;color:var(--i2)}
.loc{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:26px}
.loc input{width:120px;height:38px;padding:0 12px;font-family:inherit;font-size:13px;background:#fff;border:1.5px solid var(--ln);border-radius:9px;outline:none}
.loc input:focus{border-color:var(--y2)}
.loc button{height:38px;padding:0 18px;font-family:inherit;font-size:13px;font-weight:600;color:var(--ink);background:var(--y);border:none;border-radius:9px;cursor:pointer;transition:background .15s}
.loc button:hover{background:var(--y2)}
main{max-width:1100px;margin:0 auto;padding:0 24px 80px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.card{background:#fff;border:1.5px solid var(--ln);border-radius:14px;padding:24px;transition:border-color .2s}
.card:hover{border-color:var(--y)}
.card.wide{grid-column:1/-1}
h2{font-family:'Monoton',Impact,cursive;font-weight:400;font-size:18px;letter-spacing:1.5px;margin-bottom:20px;padding-bottom:12px;border-bottom:3px solid var(--y);display:inline-block}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.row label{font-size:13px;color:var(--i2);flex-shrink:0}
.row input,.row select{width:58%;height:38px;padding:0 12px;font-family:inherit;font-size:13px;background:#fff;border:1.5px solid var(--ln);border-radius:8px;outline:none;transition:border-color .15s}
.row input:focus,.row select:focus{border-color:var(--y2)}
.out{margin-top:18px;padding:16px 18px;font-size:13px;line-height:1.95;background:var(--ys);border-radius:10px;min-height:52px}
.kv{display:flex;justify-content:space-between;gap:12px}
.kv b{font-weight:700;color:#8A6D00;flex-shrink:0}
table{width:100%;border-collapse:collapse}
td{padding:5px 0;font-size:13px;border-bottom:1px dashed rgba(0,0,0,.07)}
td:last-child{text-align:right;font-weight:600}
tr:last-child td{border:none}
.hint{font-size:12px;color:var(--i3);margin-top:10px}
@media(max-width:560px){main{padding:0 16px 60px}.card{padding:20px}.row input,.row select{width:52%}}
</style>
</head>
<body>

<header>
  <h1 class="mono">LUMEN</h1>
  <p class="sub">光引 · 摄影工具箱</p>
  <div class="loc">
    <input id="lat" type="number" step="0.0001" placeholder="纬度">
    <input id="lng" type="number" step="0.0001" placeholder="经度">
    <button id="geo">定位</button>
  </div>
</header>

<main>

  <section class="card wide">
    <h2>光线时刻</h2>
    <div class="row"><label>日期</label><input id="d-date" type="date"></div>
    <div class="out" id="sun-out">输入经纬度或点击定位</div>
  </section>

  <section class="card">
    <h2>景深</h2>
    <div class="row"><label>焦距 (mm)</label><input id="f1" type="number" value="50" min="1"></div>
    <div class="row"><label>光圈 f/</label><input id="f2" type="number" value="2.8" step="0.1"></div>
    <div class="row"><label>距离 (m)</label><input id="f3" type="number" value="3" step="0.1"></div>
    <div class="row"><label>画幅</label><select id="f4">
      <option value="0.045">中画幅</option>
      <option value="0.03" selected>全画幅</option>
      <option value="0.02">APS-C</option>
      <option value="0.015">M4/3</option>
    </select></div>
    <div class="out" id="dof-out">—</div>
  </section>

  <section class="card">
    <h2>ND 滤镜</h2>
    <div class="row"><label>原快门 (秒)</label><input id="n1" type="number" value="0.004" step="0.001"></div>
    <div class="row"><label>档数 stops</label><input id="n2" type="number" value="10" min="1" max="20"></div>
    <div class="out" id="nd-out">—</div>
  </section>

  <section class="card">
    <h2>等效焦距</h2>
    <div class="row"><label>焦距 (mm)</label><input id="c1" type="number" value="50"></div>
    <div class="row"><label>画幅</label><select id="c2">
      <option value="1">全画幅</option>
      <option value="0.79">中画幅</option>
      <option value="1.5">APS-C</option>
      <option value="2">M4/3</option>
    </select></div>
    <div class="out" id="crop-out">—</div>
  </section>

  <section class="card">
    <h2>星空曝光</h2>
    <div class="row"><label>焦距 (mm)</label><input id="s1" type="number" value="24"></div>
    <div class="row"><label>光圈 f/</label><input id="s2" type="number" value="2.8" step="0.1"></div>
    <div class="row"><label>机身</label><select id="s3">
      <option value="1">全画幅</option>
      <option value="1.5">APS-C</option>
      <option value="2">M4/3</option>
    </select></div>
    <div class="row"><label>像素宽 (px)</label><input id="s4" type="number" value="6000" step="100"></div>
    <div class="out" id="star-out">—</div>
  </section>

</main>

<script>
const RAD=Math.PI/180,DEG=180/Math.PI,$=id=>document.getElementById(id);
const loc={lat:null,lng:null};

/* ---------- 太阳位置（低精度，误差<0.02°） ---------- */
function jd(d){return d.getTime()/86400000+2440587.5}
function sunPos(date,lat,lng){
  const d=jd(date)-2451545.0;
  const L=(280.460+0.9856474*d)%360;
  const g=((357.528+0.9856003*d)%360)*RAD;
  const la=(L+1.915*Math.sin(g)+0.020*Math.sin(2*g))*RAD;
  const eps=(23.439-0.0000004*d)*RAD;
  const ra=Math.atan2(Math.cos(eps)*Math.sin(la),Math.cos(la))*DEG;
  const dec=Math.asin(Math.sin(eps)*Math.sin(la))*DEG;
  const gmst=(((18.697374558+24.06570982441908*d)%24)+24)%24;
  const H=((((gmst*15+lng-ra)%360)+360)%360)*RAD;
  const laR=lat*RAD,deR=dec*RAD;
  return Math.asin(Math.sin(laR)*Math.sin(deR)+Math.cos(laR)*Math.cos(deR)*Math.cos(H))*DEG;
}

function scanDay(date,lat,lng){
  const s=new Date(date);s.setHours(0,0,0,0);
  const arr=[];
  for(let m=0;m<=1440;m++){
    const t=new Date(s.getTime()+m*60000);
    arr.push({t,alt:sunPos(t,lat,lng)});
  }
  return arr;
}
function cross(s,th,rise){
  for(let i=1;i<s.length;i++){
    const a=s[i-1].alt,b=s[i].alt;
    if(rise&&a<th&&b>=th)return new Date(s[i-1].t.getTime()+(th-a)/(b-a)*60000);
    if(!rise&&a>=th&&b<th)return new Date(s[i-1].t.getTime()+(a-th)/(a-b)*60000);
  }
  return null;
}
const ft=d=>d?d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false}):'—';

function updateSun(){
  if(loc.lat===null)return;
  const ds=$('d-date').value;
  const date=ds?new Date(ds+'T12:00:00'):new Date();
  const s=scanDay(date,loc.lat,loc.lng);
  const sunrise=cross(s,-0.833,true),sunset=cross(s,-0.833,false);
  const gAM=cross(s,6,true),gPM=cross(s,6,false);
  const bAM=cross(s,-4,true),bAMe=cross(s,-6,true);
  const bPM=cross(s,-4,false),bPMe=cross(s,-6,false);

  $('sun-out').innerHTML=`<table>
    <tr><td>蓝调（早）</td><td>${ft(bAM)} – ${ft(bAMe)}</td></tr>
    <tr><td>黄金（早）</td><td>${ft(gAM)} – ${ft(sunrise)}</td></tr>
    <tr><td>日出</td><td>${ft(sunrise)}</td></tr>
    <tr><td>日落</td><td>${ft(sunset)}</td></tr>
    <tr><td>黄金（晚）</td><td>${ft(sunset)} – ${ft(gPM)}</td></tr>
    <tr><td>蓝调（晚）</td><td>${ft(bPM)} – ${ft(bPMe)}</td></tr>
  </table>`;
}

/* ---------- 定位 ---------- */
$('geo').onclick=()=>{
  if(!navigator.geolocation)return alert('浏览器不支持定位');
  navigator.geolocation.getCurrentPosition(
    p=>setLoc(p.coords.latitude,p.coords.longitude),
    ()=>alert('定位失败，请手动输入经纬度'),
    {enableHighAccuracy:true,timeout:10000}
  );
};
['lat','lng'].forEach(id=>$(id).onchange=()=>{
  const a=parseFloat($('lat').value),b=parseFloat($('lng').value);
  if(isFinite(a)&&isFinite(b))setLoc(a,b);
});
function setLoc(a,b){
  loc.lat=a;loc.lng=b;
  $('lat').value=a.toFixed(4);$('lng').value=b.toFixed(4);
  updateSun();
}

/* ---------- 景深 ---------- */
['f1','f2','f3','f4'].forEach(id=>$(id).oninput=calcDof);
function calcDof(){
  const f=+$('f1').value,N=+$('f2').value,s=+$('f3').value,c=+$('f4').value;
  const o=$('dof-out');
  if(!(f>0&&N>0&&s>0&&c>0)){o.textContent='—';return}
  const sm=s*1000,H=f*f/(N*c)+f;
  const near=sm*(H-f)/(H+sm-2*f);
  const far=sm<H?sm*(H-f)/(H-sm):Infinity;
  const fm=v=>!isFinite(v)?'∞':v>=1000?(v/1000).toFixed(2)+' m':v.toFixed(0)+' mm';
  o.innerHTML=`
    <div class="kv"><span>超焦距</span><b>${fm(H)}</b></div>
    <div class="kv"><span>近界</span><b>${fm(near)}</b></div>
    <div class="kv"><span>远界</span><b>${fm(far)}</b></div>
    <div class="kv"><span>景深</span><b>${isFinite(far)?fm(far-near):'∞'}</b></div>`;
}
calcDof();

/* ---------- ND ---------- */
['n1','n2'].forEach(id=>$(id).oninput=calcNd);
function calcNd(){
  const b=+$('n1').value,st=+$('n2').value,o=$('nd-out');
  if(!(b>0)||!(st>=0)){o.textContent='—';return}
  const r=b*Math.pow(2,st);
  o.innerHTML=`
    <div class="kv"><span>减光倍率</span><b>${Math.pow(2,st).toLocaleString()}×</b></div>
    <div class="kv"><span>新快门</span><b>${dur(r)}</b></div>`;
}
function dur(s){
  if(s<1)return(s*1000).toFixed(0)+' ms';
  if(s<60)return s.toFixed(1)+' 秒';
  const m=Math.floor(s/60),ss=Math.round(s%60);
  if(m<60)return `${m} 分 ${ss} 秒`;
  return `${Math.floor(m/60)} 时 ${m%60} 分`;
}
calcNd();

/* ---------- 等效焦距 ---------- */
['c1','c2'].forEach(id=>$(id).oninput=calcCrop);
function calcCrop(){
  const f=+$('c1').value,c=+$('c2').value,o=$('crop-out');
  if(!(f>0&&c>0)){o.textContent='—';return}
  const eq=f*c,fov=2*Math.atan(36/(2*eq))*DEG;
  o.innerHTML=`
    <div class="kv"><span>等效焦距</span><b>${eq.toFixed(1)} mm</b></div>
    <div class="kv"><span>水平视角</span><b>${fov.toFixed(1)}°</b></div>`;
}
calcCrop();

/* ---------- 星空 ---------- */
['s1','s2','s3','s4'].forEach(id=>$(id).oninput=calcStar);
function calcStar(){
  const f=+$('s1').value,N=+$('s2').value,c=+$('s3').value,px=+$('s4').value,o=$('star-out');
  if(!(f>0&&c>0&&px>0)){o.textContent='—';return}
  const fEq=f*c;
  const t500=500/fEq;
  const pitch=(36/px)*1000;
  const tNpf=(35*N+30*pitch)/f;
  o.innerHTML=`
    <div class="kv"><span>500 法则</span><b>${t500.toFixed(1)} 秒</b></div>
    <div class="kv"><span>NPF 法则</span><b>${tNpf.toFixed(1)} 秒</b></div>
    <div class="kv"><span>保守锐星值</span><b>${(tNpf*0.5).toFixed(1)} 秒</b></div>
    <div class="kv"><span>像素间距</span><b>${pitch.toFixed(2)} μm</b></div>`;
}
calcStar();

/* ---------- 初始化 ---------- */
$('d-date').value=new Date().toISOString().slice(0,10);
$('d-date').onchange=updateSun;
</script>
</body>
</html>
